[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
# E/W = pycodestyle, F = pyflakes, I = isort, UP = pyupgrade,
# B = flake8-bugbear, C4 = flake8-comprehensions, PIE = flake8-pie
select = ["E", "W", "F", "I", "UP", "B", "C4", "PIE"]
ignore = [
    "E501",   # line too long — handled by formatter, not linter
]

[tool.ruff.lint.per-file-ignores]
"*/migrations/*" = ["E501", "F401", "F811"]
"*/tests/*"      = ["B011"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

# ---------------------------------------------------------------------------
# mypy
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.12"
# Not full strict — that would require annotating every Django internal.
# These settings catch real bugs without drowning in false positives.
disallow_untyped_defs     = true
disallow_incomplete_defs  = true
check_untyped_defs        = true
warn_return_any           = true
warn_unused_ignores       = true
warn_redundant_casts      = true
no_implicit_optional      = true
ignore_missing_imports    = true   # third-party stubs not always available
exclude                   = ["migrations/", "frontend/", "node_modules/"]

[[tool.mypy.overrides]]
# Django migrations are auto-generated — skip them entirely
module = ["reconciliation.migrations.*", "backend.migrations.*"]
ignore_errors = true

# ---------------------------------------------------------------------------
# pytest (mirrors pytest.ini so both configs work)
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "backend.test_settings"
python_files  = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"
